<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free PDF Tools V6 - Merge Fixed</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#101820;color:white}.wrap{max-width:900px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#10446d,#092338);border-radius:18px;padding:20px;text-align:center}.hero h1{margin:0;color:#bfe4ff}.card{background:#1e1e1e;border:1px solid #444;border-radius:16px;padding:16px;margin:14px 0}h2{color:#bfe4ff;font-size:24px}input{width:100%;padding:13px;border:2px dashed #3a6c9a;border-radius:10px;background:#333;color:white;margin:8px 0;font-size:16px}button{width:100%;background:#0d4774;color:white;border:0;border-radius:11px;padding:14px;font-size:16px;font-weight:bold;margin:8px 0}.status,.fileList{background:#102234;color:#bfe4ff;font-weight:bold;border-radius:10px;padding:12px;margin-top:8px;white-space:pre-wrap}.progressBox{background:#26323d;border-radius:12px;overflow:hidden;height:24px;margin-top:10px;border:1px solid #3c5368}.progressBar{height:100%;width:0%;background:linear-gradient(90deg,#16804b,#37d67a);text-align:center;color:white;font-weight:bold;font-size:13px;line-height:24px}a.download{display:none;background:#16804b;color:white;text-decoration:none;border-radius:11px;padding:14px;margin-top:8px;text-align:center;font-weight:bold;width:100%}.warn{background:#40320d;color:#ffe38a;border:1px solid #7d6415;border-radius:12px;padding:12px;margin:12px 0}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>📄 Free PDF Tools V6</h1><p>PDF Merge fixed + Image to PDF working</p></div>
<div class="warn">Upload के बाद नीचे file names दिखें, फिर button दबाएँ।</div>

<div class="card"><h2>System Check</h2><button type="button" onclick="v6Check()">Check Libraries</button><div id="v6System" class="status">Check दबाएँ</div></div>

<div class="card">
<h2>1. PDF Merge</h2>
<input type="file" id="v6MergeInput" accept=".pdf,application/pdf" multiple>
<div id="v6MergeList" class="fileList">No PDF selected</div>
<button type="button" onclick="v6MergeNow()">Merge PDF</button>
<div class="progressBox"><div id="v6MergeBar" class="progressBar">0%</div></div>
<a id="v6MergeDownload" class="download">Download</a>
<div id="v6MergeStatus" class="status">PDF files select करें।</div>
</div>

<div class="card">
<h2>2. Image to PDF</h2>
<input type="file" id="v6ImageInput" accept="image/*" multiple>
<div id="v6ImageList" class="fileList">No image selected</div>
<button type="button" onclick="v6ImagesNow()">Convert Images to PDF</button>
<div class="progressBox"><div id="v6ImageBar" class="progressBar">0%</div></div>
<a id="v6ImageDownload" class="download">Download</a>
<div id="v6ImageStatus" class="status">Images select करें।</div>
</div>
</div>

<script>
let v6MergeFiles=[], v6ImageFiles=[];
function q(id){return document.getElementById(id)}
function st(id,t){q(id).textContent=t}
function bar(id,p){p=Math.max(0,Math.min(100,Math.round(p)));q(id).style.width=p+"%";q(id).textContent=p+"%"}
function show(id,blob,name){const a=q(id);if(a.href)URL.revokeObjectURL(a.href);a.href=URL.createObjectURL(blob);a.download=name;a.textContent="⬇️ Download "+name;a.style.display="block"}
async function ab(f){return await f.arrayBuffer()}
function wait(){return new Promise(r=>setTimeout(r,40))}
function v6Check(){st("v6System","PDFLib: "+(window.PDFLib?"OK ✅":"FAIL ❌")+"\njsPDF: "+(window.jspdf?"OK ✅":"FAIL ❌"))}

q("v6MergeInput").addEventListener("change",function(e){
 v6MergeFiles=Array.from(e.target.files||[]);
 st("v6MergeList",v6MergeFiles.length?"Selected: "+v6MergeFiles.length+"\n"+v6MergeFiles.map((f,i)=>(i+1)+". "+f.name+" ("+(f.size/1024).toFixed(1)+" KB)").join("\n"):"No PDF selected");
 st("v6MergeStatus","Ready: "+v6MergeFiles.length+" PDF selected");
});
q("v6ImageInput").addEventListener("change",function(e){
 v6ImageFiles=Array.from(e.target.files||[]);
 st("v6ImageList",v6ImageFiles.length?"Selected: "+v6ImageFiles.length+"\n"+v6ImageFiles.map((f,i)=>(i+1)+". "+f.name+" ("+(f.size/1024).toFixed(1)+" KB)").join("\n"):"No image selected");
 st("v6ImageStatus","Ready: "+v6ImageFiles.length+" images selected");
});

async function v6MergeNow(){
 q("v6MergeDownload").style.display="none";bar("v6MergeBar",0);
 const files=v6MergeFiles;
 st("v6MergeStatus","Button दब गया\nDetected PDFs: "+files.length);
 if(!window.PDFLib){st("v6MergeStatus","PDFLib load नहीं हुई");return}
 if(files.length<2){st("v6MergeStatus","कम से कम 2 PDF चाहिए। अभी detected: "+files.length);return}
 try{
  const out=await PDFLib.PDFDocument.create();
  for(let i=0;i<files.length;i++){
   let start=(i/files.length)*85;bar("v6MergeBar",start);st("v6MergeStatus","Reading "+(i+1)+"/"+files.length+"\n"+files[i].name);await wait();
   const src=await PDFLib.PDFDocument.load(await ab(files[i]),{ignoreEncryption:true});
   const copied=await out.copyPages(src,src.getPageIndices());
   copied.forEach((p,pi)=>{out.addPage(p);bar("v6MergeBar",start+((pi+1)/copied.length)*(85/files.length))});
  }
  st("v6MergeStatus","Saving final PDF...");bar("v6MergeBar",95);await wait();
  const bytes=await out.save({useObjectStreams:true});
  show("v6MergeDownload",new Blob([bytes],{type:"application/pdf"}),"merged-pdf.pdf");
  bar("v6MergeBar",100);st("v6MergeStatus","✅ 100% Complete\nDownload button दबाएँ।");
 }catch(err){st("v6MergeStatus","❌ Merge error: "+err.message+"\nProtected/corrupt PDF हो सकती है।")}
}

function readData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function loadImg(src){return new Promise((res,rej)=>{let img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=src})}
async function v6ImagesNow(){
 q("v6ImageDownload").style.display="none";bar("v6ImageBar",0);
 const files=v6ImageFiles;st("v6ImageStatus","Button दब गया\nDetected images: "+files.length);
 if(!window.jspdf){st("v6ImageStatus","jsPDF load नहीं हुई");return}
 if(files.length<1){st("v6ImageStatus","कम से कम 1 image चाहिए");return}
 try{
  const jsPDF=window.jspdf.jsPDF;const pdf=new jsPDF("p","mm","a4");
  for(let i=0;i<files.length;i++){
   bar("v6ImageBar",(i/files.length)*90);st("v6ImageStatus","Processing image "+(i+1)+"/"+files.length);
   const data=await readData(files[i]);const img=await loadImg(data);if(i>0)pdf.addPage();
   const pageW=210,pageH=297,m=10,maxW=pageW-2*m,maxH=pageH-2*m;let w=maxW,h=img.height*w/img.width;if(h>maxH){h=maxH;w=img.width*h/img.height}
   pdf.addImage(data,files[i].type.includes("png")?"PNG":"JPEG",(pageW-w)/2,(pageH-h)/2,w,h);
  }
  show("v6ImageDownload",pdf.output("blob"),"images-to-pdf.pdf");bar("v6ImageBar",100);st("v6ImageStatus","✅ 100% Complete\nDownload button दबाएँ।");
 }catch(err){st("v6ImageStatus","❌ Image error: "+err.message)}
}
setTimeout(v6Check,700);
</script>
</body>
</html>
